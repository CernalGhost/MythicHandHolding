name: Tag release from TOC

# Every merge to main: resolve version from .toc, push tag, package + CurseForge upload.
# If vX.Y.Z already exists, auto-bumps PATCH on a local commit (tag only — main is protected).
# Packager runs in this workflow because GITHUB_TOKEN tag pushes do not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve releasable version
        id: ver
        run: |
          set -euo pipefail
          read_toc_version() {
            grep -m1 '^## Version:' MythicHandHolding.toc | sed 's/^## Version:[[:space:]]*//'
          }
          bump_patch() {
            local v="$1" major minor patch
            IFS='.' read -r major minor patch <<< "$v"
            patch=$((patch + 1))
            echo "${major}.${minor}.${patch}"
          }
          VERSION="$(read_toc_version)"
          if [ -z "$VERSION" ]; then
            echo "No ## Version: in MythicHandHolding.toc" >&2
            exit 1
          fi
          ORIG="$VERSION"
          while git rev-parse "v${VERSION}" >/dev/null 2>&1; do
            echo "Tag v${VERSION} exists; bumping patch."
            VERSION="$(bump_patch "$VERSION")"
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bumped=$([ "$VERSION" != "$ORIG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (from $ORIG)"

      - name: Prepare release commit
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "${{ steps.ver.outputs.bumped }}" = "true" ]; then
            sed -i "s/^## Version: .*/## Version: ${VERSION}/" MythicHandHolding.toc
            sed -i "s/^local VERSION  = \".*\"/local VERSION  = \"${VERSION}\"/" MythicHandHolding.lua
            sed -i "s/^--  MythicHandHolding  v.*/--  MythicHandHolding  v${VERSION}/" MythicHandHolding.lua
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MythicHandHolding.toc MythicHandHolding.lua
            git commit -m "chore(release): bump version to ${VERSION} [skip release]"
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
